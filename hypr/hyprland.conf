source = ~/.config/hypr/monitors.conf

# ── Autostart ─────────────────────────────────────────────────────────
exec-once = waybar & udiskie
exec-once = awww-daemon
exec-once = swaync
exec-once = hypridle
exec-once = hyprlock

# ── Extra files ───────────────────────────────────────────────────────
source = ~/.config/hypr/binds.conf

# ── Environment ───────────────────────────────────────────────────────
env = GDK_BACKEND=wayland,x11
env = QT_QPA_PLATFORM=wayland;xcb
env = SDL_VIDEODRIVER=wayland
env = CLUTTER_BACKEND=wayland
env = XDG_CURRENT_DESKTOP=Hyprland
env = XDG_SESSION_TYPE=wayland
env = XDG_SESSION_DESKTOP=Hyprland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION=1
env = QT_QPA_PLATFORMTHEME=qt5ct

# ── Input ─────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.5

    touchpad {
        natural_scroll = true
    }
}

# ── General ───────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 13
    border_size = 1
    col.active_border   = rgba(c3c7c8bb)
    col.inactive_border = rgba(2a2a2aaa)
    layout = dwindle
}

# ── Decoration ────────────────────────────────────────────────────────
decoration {
    rounding = 10
    inactive_opacity = 0.88
    active_opacity   = 1.0

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.012
        contrast = 1.0
        brightness = 0.9
        xray = false
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }
}

# ── Animations ────────────────────────────────────────────────────────
animations {
    enabled = true

    # Snappy out, slight overshoot on entry
    bezier = snappy,   0.25, 1.0,  0.5,  1.0
    bezier = overshoot, 0.05, 0.9, 0.1, 1.05
    bezier = linear,   0.0,  0.0,  1.0,  1.0

    # Windows — fast in, instant out
    animation = windowsIn,  1, 4, overshoot, popin 85%
    animation = windowsOut, 1, 3, snappy,    popin 85%
    animation = windowsMove,1, 3, snappy

    # Fades
    animation = fadeIn,     1, 3, snappy
    animation = fadeOut,    1, 2, snappy
    animation = fadeDim,    1, 3, snappy

    # Border color change
    animation = border,      1, 6, snappy
    animation = borderangle, 1, 6, linear, loop

    # Workspaces — slide, tight and quick
    animation = workspaces,  1, 3, snappy, slide
}

# ── Layouts ───────────────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── Window Rules ──────────────────────────────────────────────────────

